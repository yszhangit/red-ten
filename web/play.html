<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Red Ten Poker 红十 — Play</title>
<link rel="stylesheet" href="/src/styles/tokens.css">
<link rel="stylesheet" href="/src/styles/card.css">
<link rel="stylesheet" href="/src/styles/table.css">
<link rel="stylesheet" href="/src/styles/components.css">
<link rel="stylesheet" href="/src/styles/texture.css">
<link rel="stylesheet" href="/src/styles/animations.css">
<script type="module">
import { sound } from '/src/lib/sound.js';
import { speech } from '/src/lib/speech.js';
window._sound = sound;
window._speech = speech;
</script>
</head>
<body>

<div id="conn-badge" class="off">⬤ disconnected</div>
<button id="debug-btn">🚩 Flag</button>
<div id="debug-toast"></div>

<!-- ── Lobby ─────────────────────────────────────────────────────────────── -->
<div id="lobby-screen" class="screen active">
  <div id="lobby-box">
    <h1>红十 Red Ten Poker</h1>
    <div class="lfield">
      <label for="player-name">你的名字 Your name</label>
      <input id="player-name" type="text" maxlength="12" placeholder="例如：老王">
    </div>
    <div class="lfield">
      <label>AI difficulty for empty seats</label>
      <select id="ai-tier">
        <option value="rule">Rule-Based (fast)</option>
        <option value="search" selected>Search AI</option>
        <option value="ml">ML AI</option>
        <option value="llm">LLM AI (本地大模型, slow)</option>
      </select>
    </div>
    <div class="lfield" id="ai-debug-field">
      <label class="lcheck"><input type="checkbox" id="ai-debug">
        Debug mode — show AI hands and what the LLM was thinking</label>
    </div>
    <button id="create-btn" class="lbtn">＋ Create New Game</button>
    <div class="lobby-subtext">— or join an existing game —</div>
    <div id="room-list"></div>
    <div id="join-row">
      <input id="join-code" type="text" maxlength="4" placeholder="room code">
      <button id="join-btn">Join →</button>
    </div>
    <div id="lobby-err"></div>
    <div class="lobby-footer" id="lobby-footer">
      <a href="/" class="lobby-footer-link">← Watch AI replay viewer</a>
    </div>
  </div>
</div>

<!-- ── Room / waiting ─────────────────────────────────────────────────────── -->
<div id="room-screen" class="screen">
  <div id="room-box">
    <h2>Game Room</h2>
    <div id="room-code-display">----</div>
    <div id="room-share">Share this code with up to 5 friends</div>
    <div id="seat-grid"></div>
    <button id="start-btn">▶ Start Game</button>
    <div id="room-status-msg">Waiting for players…</div>
    <div class="lobby-footer">
      <a href="#" id="leave-btn" class="lobby-footer-link">← 离开牌桌 Leave table</a>
    </div>
  </div>
</div>

<!-- ── Game ───────────────────────────────────────────────────────────────── -->
<div id="game-screen" class="screen">
  <div id="gmain" class="game-table table-edge">
    <button id="mute-btn">🔊</button>
    <div id="gtrick-zone"></div>
    <div id="mogong-display"></div>
    <div id="gseats"></div>
    <div id="gann"></div>
    <div id="pre-game-overlay">
      <div id="pgo-title">Red Ten Poker</div>
      <div id="pgo-teams"></div>
      <div id="pgo-players"></div>
      <div id="pgo-da-gong"></div>
      <div id="pgo-mo-gong"></div>
      <div class="pgo-buttons">
        <button id="pgo-start-btn">开始新牌局</button>
        <button id="pgo-exit-btn">退出牌局</button>
      </div>
    </div>
    <div id="game-over-banner">
      <div id="gob-title">Game Over</div>
      <a href="/" id="review-link">▶ Review Game</a>
      <button id="gob-new-btn">New Game</button>
    </div>
  </div>
  <div id="gpanel">
    <h2>Score Board</h2>
    <div id="g-score-table"></div>
    <div id="gevlog-label">Event log</div>
    <div id="gevlog"></div>
  </div>
  <div id="ghand">
    <div id="ghand-actions">
      <span id="turn-msg">Waiting…</span>
      <button id="pass-btn" class="abtn pass-btn">Pass</button>
      <button id="play-btn" class="abtn play-btn" disabled>Play</button>
    </div>
  </div>
</div>

<script type="module" src="/src/pages/play.js"></script>
</body>
</html>
